{{- /*
Syncs the Loki credentials Secret from a secret store with the External Secrets
Operator. Uses the external-secrets.io/v1 API (ESO 0.17 or later).
*/ -}}
{{- if .Values.loki.basicAuth.externalSecret.enabled }}
{{- $auth := .Values.loki.basicAuth }}
{{- $es := $auth.externalSecret }}
{{- if not $es.data }}
{{- fail "loki.basicAuth.externalSecret.data must list at least one entry." }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $auth.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "alloy-pod-logs.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind | default "ClusterSecretStore" }}
    name: {{ required "loki.basicAuth.externalSecret.secretStoreRef.name is required." $es.secretStoreRef.name }}
  target:
    name: {{ $auth.secretName }}
    creationPolicy: Owner
  data:
    {{- toYaml $es.data | nindent 4 }}
{{- end }}
